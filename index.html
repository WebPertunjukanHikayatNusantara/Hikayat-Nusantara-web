<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101b2d" />
  <meta name="description" content="Hikayat Nusantara — Gelar Karya Symphony of Nusantara SMA Pangudi Luhur Santo Yosef Surakarta, 20 November 2026." />
  <title>Hikayat Nusantara — SMA Santo Yosef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #101b2d;
      --navy-2: #182840;
      --cream: #f7f2e8;
      --paper: #fffdf8;
      --gold: #d6ad61;
      --gold-light: #f0d8a6;
      --ink: #1c2938;
      --muted: #667180;
      --line: rgba(16, 27, 45, .12);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; line-height: 1.65; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(255,253,248,.93); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .nav { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
    .brand-name { font-weight: 700; line-height: 1.25; color: var(--navy); }
    .brand-school { font-size: .72rem; color: var(--muted); margin-top: 4px; }
    .nav-links { display: flex; align-items: center; gap: 25px; font-size: .9rem; font-weight: 600; }
    .nav-links a:not(.btn):hover { color: #9a702b; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 22px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; font-size: .92rem; transition: transform .2s, background .2s; cursor: pointer; }
    .btn:hover { transform: translateY(-2px); }
